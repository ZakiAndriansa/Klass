# Layanan untuk pengembangan di laptop. Pemilik: Zaki.
# Jalankan semuanya: docker compose up     Hentikan: docker compose down
# Hanya MySQL:       npm run db:up
#
# Kata sandi di bawah hanya untuk pengembangan lokal. Jangan dipakai di server.
name: klass

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: klass
      MYSQL_USER: klass
      MYSQL_PASSWORD: klass_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Port 3307 di laptop, supaya tidak bentrok dengan MySQL Laragon atau XAMPP di 3306.
      - "3307:3306"
    volumes:
      - klass-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Frontend dan backend Klass adalah satu aplikasi Next.js, jadi cukup satu layanan.
  # Berjalan dalam mode pengembangan, sama seperti `npm run dev` di laptop.
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Di dalam Docker, database dipanggil lewat nama layanan `db`, bukan localhost.
      # Nilai ini menimpa DATABASE_URL dari `.env` saat aplikasi berjalan di kontainer.
      DATABASE_URL: mysql://klass:klass_dev@db:3306/klass
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # Folder proyek dipasang ke kontainer supaya perubahan kode langsung terlihat.
      # `:z` diperlukan di Linux dengan SELinux (misalnya Fedora); di sistem lain diabaikan.
      - .:/app:z
      # node_modules dan cache Next.js disimpan di volume Docker, bukan di folder proyek.
      - klass-node-modules:/app/node_modules
      - klass-next:/app/.next
    # Pasang paket saat menyala (cepat bila sudah terpasang), lalu jalankan Next.js.
    # `exec` membuat Ctrl+C dan `docker compose down` langsung menghentikan server.
    command: sh -c "npm install --no-audit --no-fund && exec npm run dev"

volumes:
  klass-db:
  klass-node-modules:
  klass-next:
